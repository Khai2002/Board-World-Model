<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Board API Bridge</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #12181f;
    --border: #22303c;
    --text: #d6e2ea;
    --muted: #7a8b98;
    --accent: #4fc3a1;
    --accent-dim: #2c5c4f;
    --error: #e5646a;
    --font-mono: "SF Mono", "JetBrains Mono", "Consolas", monospace;
  }

  * { box-sizing: border-box; }

  body {
    width: 380px;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
  }

  header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header h1 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--text);
  }

  header h1 span { color: var(--accent); }

  #statusDot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  #statusDot.ok { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  #statusDot.bad { background: var(--error); box-shadow: 0 0 6px var(--error); }

  #statusLine {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    line-height: 1.5;
  }
  #statusLine b { color: var(--text); font-weight: 600; }

  .section {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }

  label {
    display: block;
    color: var(--muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.06em;
  }

  input[type="text"] {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    border-radius: 3px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent-dim); }

  .btn-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 8px;
  }
  .btn-grid button.full { grid-column: 1 / -1; }

  button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    border-radius: 3px;
    cursor: pointer;
    text-align: left;
  }
  button:hover { border-color: var(--accent-dim); color: var(--accent); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.4; cursor: default; }

  #output {
    margin: 0;
    padding: 10px 12px;
    max-height: 260px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 11px;
    line-height: 1.5;
    color: var(--text);
    background: var(--panel);
  }
  #output.error { color: var(--error); }
  #output:empty::before {
    content: "// output will appear here";
    color: var(--muted);
  }

  #meta {
    padding: 6px 12px;
    color: var(--muted);
    font-size: 10px;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>
  <header>
    <h1>board<span>::</span>bridge</h1>
    <div id="statusDot" title="connection status"></div>
  </header>

  <div id="statusLine">checking page…</div>

  <div class="section">
    <label for="dbname">dbName</label>
    <input type="text" id="dbname" placeholder="e.g. MyDatabase" />
    <div class="btn-grid">
      <button class="full" id="btnClientInfo">check connection</button>
      <button id="btnDatabases">list databases</button>
      <button id="btnEntities">get entities</button>
      <button id="btnCubes">get cubes</button>
      <button id="btnProcedures">core procedures</button>
    </div>
  </div>

  <pre id="output"></pre>
  <div id="meta"></div>

  <script src="popup.js"></script>
</body>
</html>

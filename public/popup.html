<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cube Model</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #12181f;
    --border: #22303c;
    --text: #d6e2ea;
    --muted: #7a8b98;
    --accent: #32bef0;
    --accent-dim: #2c5c4f;
    --error: #e5646a;
    --font-mono: "SF Mono", "JetBrains Mono", "Consolas", monospace;
  }

  * { box-sizing: border-box; }

  body {
    width: 380px;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
  }

  header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header h1 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--text);
  }

  header h1 span { color: var(--accent); }

  #statusDot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  #statusDot.ok { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  #statusDot.bad { background: var(--error); box-shadow: 0 0 6px var(--error); }

  #statusLine {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    line-height: 1.5;
  }
  #statusLine b { color: var(--text); font-weight: 600; }

  .section {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }

  label {
    display: block;
    color: var(--muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.06em;
  }

  input[type="text"] {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    border-radius: 3px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent-dim); }

  .btn-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 8px;
  }
  .btn-grid button.full { grid-column: 1 / -1; }

  button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    border-radius: 3px;
    cursor: pointer;
    text-align: left;
  }
  button:hover { border-color: var(--accent-dim); color: var(--accent); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.4; cursor: default; }

  dialog {
    width: 320px;
    padding: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font: inherit;
  }
  dialog::backdrop { background: rgb(0 0 0 / 65%); }
  dialog form { padding: 12px; }
  dialog h2 {
    margin: 0 0 12px;
    font-size: 12px;
    font-weight: 600;
  }
  dialog select {
    width: 100%;
    padding: 7px 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font: inherit;
  }
  #capsuleDialog {
    width: 350px;
    max-height: 80vh;
  }
  #capsuleTree {
    max-height: 48vh;
    overflow: auto;
    padding: 0 0 0 18px;
    margin: 0;
    list-style: none;
  }
  #capsuleTree ul {
    padding-left: 18px;
    list-style: none;
  }
  #capsuleTree label {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    margin: 5px 0;
    color: var(--text);
    text-transform: none;
    font-size: 11px;
    letter-spacing: 0;
    overflow-wrap: anywhere;
  }
  #capsuleTree input { margin: 1px 0 0; accent-color: var(--accent); }
  #capsuleSelectionCount { color: var(--muted); margin-top: 8px; }
  .dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 12px;
  }

  #output {
    margin: 0;
    padding: 10px 12px;
    max-height: 260px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 11px;
    line-height: 1.5;
    color: var(--text);
    background: var(--panel);
  }
  #output.error { color: var(--error); }
  #output:empty::before {
    content: "// output will appear here";
    color: var(--muted);
  }

  #meta {
    padding: 6px 12px;
    color: var(--muted);
    font-size: 10px;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>
  <header>
    <h1>cube<span>::</span>model</h1>
    <div id="statusDot" title="connection status"></div>
  </header>

  <div id="statusLine">checking page…</div>

  <div class="section">
    <div id="modelLine">no database selected</div>
    <div class="btn-grid">
      <button class="full" id="btnConnection">refresh connection</button>
      <button class="full" id="btnCapsuleScreens">scan capsule screens</button>
      <button class="full" id="btnCapsuleProcedures">scan capsule procedures</button>
      <button class="full" id="btnCubes">get all cubes</button>
      <button class="full" id="btnProcedures">get all procedures</button>
      <button class="full" id="btnEdges">create all edges</button>
      <button class="full" id="btnDashboard">open dashboard</button>
    </div>
  </div>

  <dialog id="databaseDialog" aria-labelledby="databaseDialogTitle">
    <form method="dialog">
      <h2 id="databaseDialogTitle">Choose a database</h2>
      <label for="databaseSelect">Database</label>
      <select id="databaseSelect" required></select>
      <div class="dialog-actions">
        <button value="cancel">cancel</button>
        <button value="choose">scan</button>
      </div>
    </form>
  </dialog>

  <dialog id="capsuleDialog" aria-labelledby="capsuleDialogTitle">
    <form method="dialog">
      <h2 id="capsuleDialogTitle">Choose capsules</h2>
      <ul id="capsuleTree"></ul>
      <div id="capsuleSelectionCount"></div>
      <div class="dialog-actions">
        <button value="cancel">cancel</button>
        <button value="choose">select</button>
      </div>
    </form>
  </dialog>

  <pre id="output"></pre>
  <div id="meta"></div>

  <script src="assets/board-world-model.js"></script>
  <script src="popup.js"></script>
</body>
</html>

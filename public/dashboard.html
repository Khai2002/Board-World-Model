<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Board World Model Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="dashboard-header">
    <h1>Board World Model</h1>
    <button id="deleteAllButton" class="danger" type="button">Delete all local data</button>
  </div>
  <p id="status">Reading stored data…</p>
  <div class="tabs" role="tablist" aria-label="Stored data">
    <button class="tab active" id="cubesTab" type="button" role="tab" aria-selected="true">Cubes</button>
    <button class="tab" id="proceduresTab" type="button" role="tab" aria-selected="false">Procedures</button>
    <button class="tab" id="capsuleProceduresTab" type="button" role="tab" aria-selected="false">Capsule Procedures</button>
    <button class="tab" id="capsulesTab" type="button" role="tab" aria-selected="false">Capsules &amp; Screens</button>
  </div>
  <section class="tab-panel" id="cubesPanel" role="tabpanel">
    <div class="model-filter">
      <span class="model-filter-label">Filter by data model</span>
      <details id="cubeModelFilter">
        <summary id="cubeModelFilterSummary">All data models</summary>
        <div class="model-filter-menu">
          <div id="cubeModelOptions"></div>
          <button id="clearCubeModelFilter" type="button">Clear selection</button>
        </div>
      </details>
    </div>
    <p id="cubeStorageSize" class="storage-size"></p>
    <input id="cubeSearch" class="search" type="search" placeholder="Search cubes" aria-label="Search cubes">
    <ul id="cubes"></ul>
  </section>
  <section class="tab-panel" id="proceduresPanel" role="tabpanel" hidden>
    <div class="model-filter">
      <span class="model-filter-label">Filter by data model</span>
      <details id="procedureModelFilter">
        <summary id="procedureModelFilterSummary">All data models</summary>
        <div class="model-filter-menu">
          <div id="procedureModelOptions"></div>
          <button id="clearProcedureModelFilter" type="button">Clear selection</button>
        </div>
      </details>
    </div>
    <p id="procedureStorageSize" class="storage-size"></p>
    <input id="procedureSearch" class="search" type="search" placeholder="Search procedures" aria-label="Search procedures">
    <ul id="procedures"></ul>
  </section>
  <section class="tab-panel" id="capsuleProceduresPanel" role="tabpanel" hidden>
    <p id="capsuleProcedureStorageSize" class="storage-size"></p>
    <input id="capsuleProcedureSearch" class="search" type="search" placeholder="Search capsule procedures" aria-label="Search capsule procedures">
    <ul id="capsuleProcedures"></ul>
  </section>
  <section class="tab-panel" id="capsulesPanel" role="tabpanel" hidden>
    <div class="capsule-columns">
      <section aria-labelledby="capsuleListHeading">
        <h2 id="capsuleListHeading">Capsules</h2>
        <p id="capsuleStorageSize" class="storage-size"></p>
        <input id="capsuleSearch" class="search" type="search" placeholder="Search capsules" aria-label="Search capsules">
        <ul id="capsules"></ul>
      </section>
      <section aria-labelledby="screenListHeading">
        <h2 id="screenListHeading">Screens</h2>
        <p id="screenStorageSize" class="storage-size"></p>
        <input id="screenSearch" class="search" type="search" placeholder="Search screens" aria-label="Search screens">
        <ul id="screens"></ul>
      </section>
    </div>
  </section>
  <script src="assets/board-world-model.js"></script>
  <script src="vis-network.min.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>

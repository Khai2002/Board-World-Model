<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Board World Model Dashboard</title>
  <style>
    body { margin: 32px; color: #202124; font: 14px system-ui, sans-serif; }
    h1 { margin-top: 0; }
    #status { color: #5f6368; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    button, select { padding: 6px 8px; font: inherit; }
    button { cursor: pointer; }
    .danger { color: #a50e0e; }
    .tabs { display: flex; gap: 4px; margin: 16px 0; border-bottom: 1px solid #dadce0; }
    .tab { border: 0; border-bottom: 2px solid transparent; background: transparent; }
    .tab.active { border-bottom-color: #174ea6; color: #174ea6; }
    .tab-panel[hidden] { display: none; }
    li { margin: 8px 0; }
    code { color: #174ea6; }
  </style>
</head>
<body>
  <h1>Board World Model</h1>
  <p id="status">Reading stored data…</p>
  <div class="tabs" role="tablist" aria-label="Stored data">
    <button class="tab active" id="cubesTab" type="button" role="tab" aria-selected="true">Cubes</button>
    <button class="tab" id="proceduresTab" type="button" role="tab" aria-selected="false">Procedures</button>
  </div>
  <section class="tab-panel" id="cubesPanel" role="tabpanel">
    <div class="actions">
      <button id="exportButton" type="button">Export JSON</button>
      <button id="importButton" type="button">Import JSON</button>
      <input id="importInput" type="file" accept="application/json,.json" hidden>
      <select id="modelSelect" aria-label="Model to delete">
        <option value="">Select a model</option>
      </select>
      <button id="deleteModelButton" type="button">Delete selected model</button>
      <button id="deleteAllButton" class="danger" type="button">Delete all local data</button>
    </div>
    <ul id="cubes"></ul>
  </section>
  <section class="tab-panel" id="proceduresPanel" role="tabpanel" hidden>
    <ul id="procedures"></ul>
  </section>
  <script src="assets/board-world-model.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
